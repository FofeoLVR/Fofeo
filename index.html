<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Fofeo</title>
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <div class="video-background">
        <video
            autoplay
            loop
            playsinline
            class="video-background">
            <source src="https://github.com/FofeoLVR/Fofeo/raw/refs/heads/main/video.mp4">
        </video>

    </div>
    <div class="video-overlay"></div>

    
    	<div class="Container" id="Container">

			<!-- HEADER -->
			<div class="Header">

					<img
							src="https://yt3.ggpht.com/Z0gPjh12EOnHh9ZSsOLAMDRa6iaXW2LYtFjzxXviwWjEH93OK6IkGLs1DIuQ9kTDoZQoRUZh=s600-c-k-c0x00ffffff-no-rj-rp-mo"
							class="ProfileImage"
							alt="Avatar de Fofeo"
					/>

					<div class="HeaderText">

							<div class="TitleDIv">
									<h1 class="ContainerTitle">Fofeo</h1>
							</div>

							<div class="ProfileContainer">

									<img
											src="https://yt3.ggpht.com/Z0gPjh12EOnHh9ZSsOLAMDRa6iaXW2LYtFjzxXviwWjEH93OK6IkGLs1DIuQ9kTDoZQoRUZh=s600-c-k-c0x00ffffff-no-rj-rp-mo"
											alt=""
											class="ImageDeProfile"
									/>

									<div class="ProfileInformationContainer">

											<div class="IconContainer">
													<img src="https://img.icons8.com/?size=1200&id=S6odLj8qKMjU&format=png" class="icon">
													<img src="https://cdn3.emoji.gg/emojis/66366-completed-a-quest.png" class="icon">
													<img src="https://cdn3.emoji.gg/emojis/99057-orbs-discord.png" class="icon">
											</div>

											<p class="ProfileText">
													👉 botw >>>>>> 
											</p>

									</div>
							</div>

					</div>
			</div>
			<!-- BIO -->
			<div class="InformationContainer">
					<p class="InformationText">
							Je suis un développeur passionné par le gaming.
							Rentrant ay lycée je continue ma vie sur cette voie.
					</p>
			</div>

			<!-- ACTIONS -->
			<div class="SocialMedia">

					<a href="https://discord.gg/gwMQ7ErvCW" class="MediaButton">
							<img
									src="https://static.vecteezy.com/system/resources/previews/018/930/505/original/discord-logo-discord-icon-transparent-free-png.png"
									class="MediaIcon"
							/>
					</a>
                    <a href="https://www.youtube.com/@Fofeo" class="MediaButton">
							<img
									src="youtube.png"
									class="YoutubeMediaIcon"
							/>
					</a>

                    <a href="https://www.tiktok.com/@fofeo.ytb?lang=en" class="MediaButton">
							<img
									src="tiktok.png"
									class="TiktokMediaIcon"
							/>
					</a>

			</div>

	</div>


    <script src="index.js" defer></script>
</body>
</html>
